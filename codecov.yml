# The tests run in 3 shards (see .github/workflows/tests.yml), each uploading its own report: wait for all of them
# before reporting, or the first would look like a fall in coverage.
codecov:
  notify:
    after_n_builds: 3

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        # New and changed lines (branches included, see --cov-branch in tests.yml) should be mostly tested; a
        # threshold of 5% keeps a small change with a few untested lines (a defensive branch) from failing.
        target: 80%
        threshold: 5%

comment:
  layout: "condensed_header, diff, files"
  require_changes: false
  after_n_builds: 3
