{% extends "touchscreen_base.html" %}

{% block title %}Setting up{% endblock %}
{% block heading %}Setting up{% endblock %}

{% block content %}
<div class="step">
    <div class="spinner" aria-hidden="true"></div>
    <h2 class="lead" role="status">One moment…</h2>
</div>

<script>
    // The touchscreen is a step behind the phone (it takes each answer every couple of seconds), so ask again.
    setTimeout(() => location.reload(), 2000);
</script>
{% endblock %}
