{% extends "touchscreen_base.html" %}
{% from "_touchscreen_marks.html" import tick %}

{% block title %}Screen added{% endblock %}
{% block heading %}All set{% endblock %}

{% block content %}
<div class="step">
    {{ tick() }}
    <h2 class="lead">Your screen is ready.</h2>
    <p class="note">You can close this page.</p>
    <button type="button" class="button" id="closePage">Close</button>
</div>

<script>
    // Browsers close only a tab a script opened, so for one a camera's QR scan opened both of these may do nothing, and
    // the page stays as the end of the visit. Close is a tap of its own, which some browsers count.
    const closePage = () => window.close("", "_parent", "");
    closePage();
    document.getElementById("closePage").addEventListener("click", () => {
        closePage();
        // Still here: the browser won't close it, so the button can't either.
        setTimeout(() => { document.getElementById("closePage").hidden = true; }, 300);
    });
</script>
{% endblock %}
