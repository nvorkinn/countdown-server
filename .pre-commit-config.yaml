repos:
  # Generated and third-party files are never rewritten by the whitespace and end-of-file fixers.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        # The largest committed file (not counting uv.lock) is ~86 kB; this catches a stray video or database dump.
        args: [--maxkb=500]
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^(vendor/|broker/static/vendor/)
      - id: trailing-whitespace
        exclude: ^(vendor/|broker/static/vendor/)
  # Ruff and ty from uv.lock, so commits are checked by the same versions as CI and Dependabot's uv updates bump them.
  # `uv run` syncs the environment first (a no-op when it is up to date). ty checks the whole project at once, not just
  # the files committed, against its installed dependencies.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ty
        name: ty
        entry: uv run --frozen ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        always_run: true
        require_serial: true
  # These run only on commits that touch .tf files, and need terraform and tflint installed.
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.5
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args: [--hook-config=--retry-once-with-cleanup=true]
      - id: terraform_tflint
        args: [--args=--config=__GIT_WORKING_DIR__/infra/cloudflare/.tflint.hcl]
