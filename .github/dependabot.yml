version: 2

# One daily PR for the whole project: every entry below feeds the `dependencies` multi-ecosystem group, which sets the
# schedule and the commit message for all of them, and `patterns: ["*"]` puts each of an entry's dependencies in it,
# major updates included. Security updates are opened separately by GitHub and are not affected by the schedule.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore(deps)"

updates:
  # pyproject.toml and uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
  # Every Dockerfile: the broker's and each infra image's base.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/caddy"
      - "/fluent-bit"
      - "/victoria-logs"
      - "/victoria-metrics"
      - "/sqlite-web"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    ignore:
      # The broker's Python moves with .python-version, by hand: a newer one than the tests run on goes untested, and
      # can lack wheels (pyyaml has none for 3.15, so it built from source, slowly under QEMU).
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  # sqlite-web/requirements.txt, the database viewer's packages (pinned with hashes).
  - package-ecosystem: "pip"
    directory: "/sqlite-web"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
  - package-ecosystem: "docker-compose"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
  # .pre-commit-config.yaml's hook revs. Ruff and ty are local hooks that run the uv.lock versions, so the uv entry
  # bumps those.
  - package-ecosystem: "pre-commit"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
  # Terraform providers (infra/cloudflare has no local modules).
  - package-ecosystem: "terraform"
    directory: "/infra/cloudflare"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
