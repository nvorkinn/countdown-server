name: Release

on:
  push:
    tags: ["v*"]
  # The "Run workflow" button (Actions > Release): tags the head of main with the next version after the
  # latest v* tag, then releases it in this same run. A tag pushed with the workflow's own token starts no
  # second run.
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

jobs:
  # A release ships only a commit whose CI passed on main. The tag push (the dashboard's Release button) and the "Run
  # workflow" button usually come right after the merge, while Tests, Lint and CodeQL are still running on main, so this
  # waits for them instead of making anyone watch: it passes once they have, and fails (so nothing is tagged or
  # deployed) if one fails, has no run on the commit, or they don't finish in time. CodeQL is GitHub's default setup, hence
  # its path.
  ci:
    name: main CI
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      # To read the commit's workflow runs.
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REQUIRED: |
            .github/workflows/tests.yml
            .github/workflows/lint.yml
            dynamic/github-code-scanning/codeql
        run: scripts/wait-for-main-ci.sh

  tag:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      # To create the tag on a button release.
      contents: write
    outputs:
      value: ${{ steps.tag.outputs.value }}
    steps:
      - name: Work out and create the next tag
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "Release from main, not $GITHUB_REF" >&2; exit 1; }
          latest="$(git ls-remote --tags --refs "https://github.com/$GITHUB_REPOSITORY" 'v*' \
            | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
          major="${major#v}"
          case "$BUMP" in
            major) next="v$((major + 1)).0.0" ;;
            minor) next="v$major.$((minor + 1)).0" ;;
            *) next="v$major.$minor.$((patch + 1))" ;;
          esac
          # Fails if the tag already exists, e.g. two releases started at once.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$next" -f sha="$GITHUB_SHA" > /dev/null
          echo "Tagged $GITHUB_SHA as $next (after ${latest:-no tag})"
          echo "NEXT_TAG=$next" >> "$GITHUB_ENV"

      - name: Extract tag
        id: tag
        run: |
          # The tag just made by the button, else the pushed tag.
          tag="${NEXT_TAG:-${GITHUB_REF#refs/tags/}}"
          # The tag is passed to a shell on the deploy host, so keep it to safe characters.
          [[ "$tag" =~ ^v[0-9A-Za-z._-]+$ ]] || { echo "Unsupported tag: $tag" >&2; exit 1; }
          echo "value=$tag" >> "$GITHUB_OUTPUT"

  # One build per image, side by side. Each is tagged with the release tag and
  # latest, for arm64 only: the host is ARM, and Tests builds its own images.
  # On an ARM runner, so nothing is emulated. An infra image whose folder (and this
  # workflow) hasn't changed since the previous release isn't rebuilt: that
  # release's image gets this tag too, so its digest stays the same and the
  # deploy leaves the running container alone (deploy.sh). The broker's image is
  # always built, as it bakes in the code.
  images:
    name: image ${{ matrix.image }}
    needs: tag
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      # For the build provenance attestation: a Sigstore certificate (OIDC) and
      # storing the attestation.
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - image: countdown-server
            context: .
          - image: countdown-server-caddy
            context: caddy
          - image: countdown-server-fluent-bit
            context: fluent-bit
          - image: countdown-server-victoria-logs
            context: victoria-logs
          - image: countdown-server-victoria-metrics
            context: victoria-metrics
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      TAG: ${{ needs.tag.outputs.value }}
      CONTEXT: ${{ matrix.context }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The broker image bakes in vendor/countdown-api; the infra images don't use it.
          submodules: ${{ matrix.context == '.' }}
          # The infra images compare their folder with the previous release's tag, so they need the history and tags.
          fetch-depth: ${{ matrix.context == '.' && 1 || 0 }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # The previous release is the newest vX.Y.Z tag on this commit's history other than this one. Its image is reused
      # when neither the image's folder nor this workflow changed since, and it is in GHCR. Copying the tags keeps the
      # same index (attestations included), so its provenance still applies. Otherwise, the build below runs.
      - name: Reuse the previous release's image if nothing changed
        id: reuse
        if: matrix.context != '.'
        run: |
          previous="$(git tag --merged HEAD --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | { grep -vxF "$TAG" || true; } | head -1)"
          if [ -z "$previous" ]; then
            echo "No earlier release to reuse; building."
          elif ! git diff --quiet "$previous" HEAD -- "$CONTEXT" .github/workflows/release.yml; then
            echo "$CONTEXT/ or release.yml changed since $previous; building."
          elif ! docker buildx imagetools inspect "$IMAGE:$previous" > /dev/null 2>&1; then
            echo "No $IMAGE:$previous in the registry; building."
          else
            docker buildx imagetools create --tag "$IMAGE:$TAG" --tag "$IMAGE:latest" "$IMAGE:$previous"
            echo "::notice::$CONTEXT/ is unchanged since $previous, so $IMAGE:$TAG is that release's image."
            echo "reused=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        id: build
        if: steps.reuse.outputs.reused != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          # BuildKit's own attestations, pushed beside the image as extra
          # (unknown/unknown platform) manifests in the tag's OCI index. A pull
          # on the arm64 host still picks the arm64 image.
          provenance: mode=max
          sbom: true

      # GitHub's signed provenance for the digest just pushed (the index's), stored
      # with the image in GHCR and in GitHub's attestation store. Verify with
      # `gh attestation verify oci://<image>:<tag> --repo nvorkinn/countdown-server`.
      # Sigstore's transparency log now and then answers 404 for the entry it has just made ("error fetching tlog
      # entry"), which failed a whole release, so a failure gets one more try 30 seconds later. A second failure is
      # real and fails the job.
      - name: Attest build provenance
        if: steps.reuse.outputs.reused != 'true'
        id: attest
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with: &attest
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Storage records need an organization-owned repository (and the artifact-metadata permission).
          create-storage-record: false

      - name: Wait before attesting again
        if: steps.attest.outcome == 'failure'
        run: sleep 30

      - name: Attest build provenance (second try)
        if: steps.attest.outcome == 'failure'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with: *attest

  # The deploy bundles are what the hosts deploy from: this release's
  # docker-compose.yml, deploy.sh, Authentik's brand assets, that target's
  # settings (config/<target>.env) and SOPS-encrypted
  # secrets, attached to the GitHub Release. There is one per target, holding
  # only that target's secrets/<target>/, so a host never gets (or could decrypt)
  # another environment's. They don't need the images, so they build alongside them.
  package:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # {"<target>": "<the bundle's SHA-256>", ...}
      sha256: ${{ steps.bundle.outputs.sha256 }}
    env:
      TAG: ${{ needs.tag.outputs.value }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build deploy bundles
        id: bundle
        run: |
          shas='{}'
          for target in dev prod; do
            # Production's secrets come later than dev's; until they are committed a release has no prod bundle,
            # so it can't be promoted (promote.yml says so).
            if [ ! -d "secrets/$target" ]; then
              echo "::notice::No secrets/$target/ yet, so no $target bundle for $TAG."
              continue
            fi
            rm -rf "deploy-$TAG"
            mkdir -p "deploy-$TAG/secrets" "deploy-$TAG/authentik"
            cp docker-compose.yml scripts/deploy.sh "deploy-$TAG/"
            cp "secrets/$target"/*.env "deploy-$TAG/secrets/"
            cp "config/$target.env" "deploy-$TAG/settings.env"
            mkdir -p "deploy-$TAG/authentik-assets"
            cp authentik-assets/* "deploy-$TAG/authentik-assets/"
            # Fixed order, times and owners, so a re-run builds the same bytes.
            tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - "deploy-$TAG" \
              | gzip -n > "deploy-$TAG-$target.tar.gz"
            sha="$(sha256sum "deploy-$TAG-$target.tar.gz" | cut -d' ' -f1)"
            shas="$(jq -c --arg target "$target" --arg sha "$sha" '. + {($target): $sha}' <<< "$shas")"
          done
          echo "sha256=$shas" >> "$GITHUB_OUTPUT"

      - name: Attach bundles to the release
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG"
          gh release upload "$TAG" "deploy-$TAG"-*.tar.gz --clobber

  # A release deploys to dev/QA only, with no approval (starting the release is
  # the decision). Production is promote.yml's, for a tag that has been through
  # here. Each target deploys this repo's services and authentik
  # (deploy-services.yml, deploy-authentik.yml). The services wait for the
  # images; authentik runs upstream's image, so it only needs the bundle and
  # can start while the images are still building. A target's environment holds
  # its host's secrets (DEPLOY_HOST and the rest).
  # Dev/QA's DNS records (infra/cloudflare), planned, and applied after approval if they change, beside the deploys. A
  # release that leaves DNS as it is asks for no approval. If it changes a name or an address, Caddy may ask for a
  # certificate before the record exists and wait a while to retry: restart it after the apply. Production's records
  # are promote.yml's.
  dns:
    name: dns
    needs: tag
    # The plan job it calls comments on pull requests, so its token asks for this even here.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/cloudflare.yml
    with:
      apply: true
      target: dev
      tag: ${{ needs.tag.outputs.value }}
    secrets: inherit

  deploy-services-dev:
    name: services (dev-qa)
    needs: [tag, images, package]
    uses: ./.github/workflows/deploy-services.yml
    with:
      environment: dev-qa
      target: dev
      tag: ${{ needs.tag.outputs.value }}
      bundle_sha256: ${{ fromJSON(needs.package.outputs.sha256).dev }}
    secrets: inherit

  deploy-authentik-dev:
    name: authentik (dev-qa)
    needs: [tag, package]
    uses: ./.github/workflows/deploy-authentik.yml
    with:
      environment: dev-qa
      target: dev
      tag: ${{ needs.tag.outputs.value }}
      bundle_sha256: ${{ fromJSON(needs.package.outputs.sha256).dev }}
    secrets: inherit

  # authentik's configuration, from this tag's terraform/: a plan, applied after approval only if it changes anything
  # (see terraform.yml). Terraform reaches authentik through Caddy, so it waits for the services deploy as well as
  # authentik's: planned beside them, it lost Caddy halfway when Caddy was recreated (connection refused). It still runs
  # when a service other than authentik failed to deploy, and not when authentik did.
  terraform-dev:
    name: terraform (dev-qa)
    needs: [tag, deploy-authentik-dev, deploy-services-dev]
    if: ${{ !cancelled() && needs.deploy-authentik-dev.result == 'success' }}
    permissions:
      contents: read
      # The plan job comments on pull requests, so its token asks for this even here.
      pull-requests: write
    uses: ./.github/workflows/terraform.yml
    with:
      apply: true
      target: dev
      tag: ${{ needs.tag.outputs.value }}
    secrets: inherit
