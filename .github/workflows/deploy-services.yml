name: Deploy services

# One target's deploy of this repo's own services (Caddy, the broker and its providers, Fluent Bit, VictoriaLogs,
# VictoriaMetrics, Redis, and on dev/QA THE MAX MIX), called by release.yml (dev/QA) and promote.yml (production). See
# also deploy-authentik.yml.
on:
  workflow_call:
    inputs:
      environment:
        description: The GitHub environment holding this target's DEPLOY_* secrets, e.g. dev-qa.
        type: string
        required: true
      target:
        description: The bundle's suffix, naming its secrets/<target>/ directory, e.g. dev.
        type: string
        required: true
      tag:
        type: string
        required: true
      bundle_sha256:
        description: The SHA-256 of this target's deploy bundle.
        type: string
        required: true

permissions:
  contents: read

jobs:
  # Each has the host fetch this release's bundle and run its deploy.sh for one
  # service.
  deploy:
    name: deploy ${{ matrix.service }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    # The target's secrets, with no reviewers of its own: promote.yml asks for its one approval before calling this, and
    # an environment with reviewers would ask again for each job of the matrix.
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      # Two at a time, in this order, the next starting as one finishes. The
      # services are independent, so a failure doesn't stop the rest.
      max-parallel: 2
      matrix:
        # Recreated only when its service changes: redis, and the-max-mix (another project's image, pulled at its
        # latest on every deploy). THE MAX MIX is dev/QA's alone: config/prod.env has none of its settings.
        service: ${{ fromJSON(inputs.target == 'dev' && '["caddy","countdown-server","fluent-bit","victoria-logs","victoria-metrics","redis","the-max-mix"]' || '["caddy","countdown-server","fluent-bit","victoria-logs","victoria-metrics","redis"]') }}
    concurrency:
      # Per service: a group the whole matrix shared would cancel all but one
      # of its pending jobs.
      group: deploy-${{ inputs.environment }}-${{ matrix.service }}-${{ inputs.tag }}
      cancel-in-progress: false
    env:
      TAG: ${{ inputs.tag }}
      SERVICE: ${{ matrix.service }}
      DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      BUNDLE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ inputs.tag }}/deploy-${{ inputs.tag }}-${{ inputs.target }}.tar.gz
      BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up SSH
        env:
          ORACLE_SSH_TOKEN: ${{ secrets.ORACLE_SSH_TOKEN }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_TOKEN" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy ${{ env.SERVICE }}
        run: ssh -i ~/.ssh/id_deploy "$DEPLOY_TARGET" bash -s -- "$SERVICE" "$TAG" "$BUNDLE_URL" "$BUNDLE_SHA256" < scripts/fetch-release.sh
