name: Deploy services

# One target's deploy of this repo's own services (Caddy, the broker and its providers, Fluent Bit, VictoriaLogs,
# VictoriaMetrics, Redis), called by release.yml (dev/QA) and promote.yml (production). See also deploy-edge.yml. Caddy
# is deployed on production only: deploy.sh leaves it alone where the edge isn't this repo's (dev/QA).
on:
  workflow_call:
    inputs:
      environment:
        description: The GitHub environment holding this target's DEPLOY_* secrets, e.g. dev-qa.
        type: string
        required: true
      target:
        description: The bundle's suffix, naming its secrets/<target>/ directory, e.g. dev.
        type: string
        required: true
      tag:
        type: string
        required: true
      bundle_sha256:
        description: The SHA-256 of this target's deploy bundle.
        type: string
        required: true

permissions:
  contents: read

jobs:
  # Each has the host fetch this release's bundle and run its deploy.sh for one
  # service.
  deploy:
    name: deploy ${{ matrix.service }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    # The target's secrets, with no reviewers of its own: promote.yml asks for its one approval before calling this, and
    # an environment with reviewers would ask again for each job of the matrix.
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      # Two at a time, in this order, the next starting as one finishes. The
      # services are independent, so a failure doesn't stop the rest.
      max-parallel: 2
      matrix:
        include:
          - service: caddy
          - service: countdown-server
          - service: fluent-bit
          - service: victoria-logs
          - service: victoria-metrics
          # Recreated only when its service changes.
          - service: redis
    concurrency:
      # Per service: a group the whole matrix shared would cancel all but one
      # of its pending jobs.
      group: deploy-${{ inputs.environment }}-${{ matrix.service }}-${{ inputs.tag }}
      cancel-in-progress: false
    env:
      TAG: ${{ inputs.tag }}
      SERVICE: ${{ matrix.service }}
      DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      # Set where the host is reachable only over the tailnet (dev/QA, on the home server); production's is public.
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_SECRET: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
      BW_CLIENTID: ${{ secrets.BW_CLIENTID }}
      BUNDLE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ inputs.tag }}/deploy-${{ inputs.tag }}-${{ inputs.target }}.tar.gz
      BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Join the tailnet
        if: ${{ env.TAILSCALE_OAUTH_CLIENT_ID != '' }}
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ env.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up SSH
        env:
          ORACLE_SSH_TOKEN: ${{ secrets.ORACLE_SSH_TOKEN }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_TOKEN" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Fetch the secrets from Vaultwarden
        # Only where the environment has the deploy bot's credentials; elsewhere deploy.sh decrypts the bundle's sops
        # files, as before.
        if: ${{ env.BW_CLIENTID != '' }}
        env:
          BW_CLIENTID: ${{ secrets.BW_CLIENTID }}
          BW_CLIENTSECRET: ${{ secrets.BW_CLIENTSECRET }}
          BW_PASSWORD: ${{ secrets.BW_PASSWORD }}
          TARGET: ${{ inputs.target }}
        run: |
          # From scripts/bitwarden-cli's lockfile, so the exact version and hashes are pinned.
          npm ci --prefix scripts/bitwarden-cli --ignore-scripts
          export PATH="$PWD/scripts/bitwarden-cli/node_modules/.bin:$PATH"
          scripts/fetch-secrets.sh "$TARGET" "$RUNNER_TEMP/secrets"
          # Into vault-secrets/ on the host, each file moved in whole, as deploy jobs can run at once.
          tar -C "$RUNNER_TEMP/secrets" -cf - . | ssh -i ~/.ssh/id_deploy "$DEPLOY_TARGET" '
            set -e
            umask 077
            dir="${DEPLOY_DIR:-/opt/auth-broker}"
            mkdir -p "$dir/vault-secrets"
            tmp="$(mktemp -d "$dir/.vault-XXXXXX")"
            tar -xf - -C "$tmp"
            for f in "$tmp"/*.env; do mv "$f" "$dir/vault-secrets/$(basename "$f")"; done
            rmdir "$tmp"'
          rm -rf "$RUNNER_TEMP/secrets"

      - name: Deploy ${{ env.SERVICE }}
        run: ssh -i ~/.ssh/id_deploy "$DEPLOY_TARGET" bash -s -- "$SERVICE" "$TAG" "$BUNDLE_URL" "$BUNDLE_SHA256" < scripts/fetch-release.sh
