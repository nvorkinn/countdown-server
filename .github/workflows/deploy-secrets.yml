name: Deploy secrets

# One target's secrets, from Vaultwarden to its host, once for the whole release or promotion: scripts/fetch-secrets.sh
# logs in as the deploy-bot user and writes the .env files of secrets-map.json's target, and they are copied to
# vault-secrets/ on the host, where each service's deploy.sh installs them. Called by release.yml (dev/QA) and promote.yml
# (production) before their deploys, which need it. If it fails, they don't run: they would otherwise find the previous
# deploy's secrets there.
on:
  workflow_call:
    inputs:
      environment:
        description: The GitHub environment holding this target's DEPLOY_* and BW_* secrets, e.g. dev-qa.
        type: string
        required: true
      target:
        description: The target's name in secrets-map.json and config/<target>.env, e.g. dev.
        type: string
        required: true

permissions:
  contents: read

jobs:
  fetch:
    name: secrets (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Like the deploys: the target's secrets, with no reviewers of its own (promote.yml asks for its one approval first).
    environment: ${{ inputs.environment }}
    concurrency:
      group: secrets-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      # Set where the host is reachable only over the tailnet (dev/QA, on the home server); production's is public.
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_SECRET: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Join the tailnet
        if: ${{ env.TAILSCALE_OAUTH_CLIENT_ID != '' }}
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ env.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up SSH
        env:
          ORACLE_SSH_TOKEN: ${{ secrets.ORACLE_SSH_TOKEN }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_TOKEN" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Fetch the secrets from Vaultwarden
        env:
          BW_CLIENTID: ${{ secrets.BW_CLIENTID }}
          BW_CLIENTSECRET: ${{ secrets.BW_CLIENTSECRET }}
          BW_PASSWORD: ${{ secrets.BW_PASSWORD }}
          TARGET: ${{ inputs.target }}
        run: |
          # From scripts/bitwarden-cli's lockfile, so the exact version and hashes are pinned. Its audit and funding
          # notices and its transitive dependencies' deprecation warnings are quiet: they are about the CLI's own
          # dependencies, which nothing here can change.
          npm ci --prefix scripts/bitwarden-cli --ignore-scripts --no-audit --no-fund --loglevel=error
          export PATH="$PWD/scripts/bitwarden-cli/node_modules/.bin:$PATH"
          scripts/fetch-secrets.sh "$TARGET" "$RUNNER_TEMP/secrets"

      - name: Copy them to the host
        run: |
          # Into vault-secrets/ on the host, each file moved in whole.
          tar -C "$RUNNER_TEMP/secrets" -cf - . | ssh -i ~/.ssh/id_deploy "$DEPLOY_TARGET" '
            set -e
            umask 077
            dir="${DEPLOY_DIR:-/opt/auth-broker}"
            mkdir -p "$dir/vault-secrets"
            tmp="$(mktemp -d "$dir/.vault-XXXXXX")"
            tar -xf - -C "$tmp"
            for f in "$tmp"/*.env; do mv "$f" "$dir/vault-secrets/$(basename "$f")"; done
            rmdir "$tmp"'
          rm -rf "$RUNNER_TEMP/secrets"
