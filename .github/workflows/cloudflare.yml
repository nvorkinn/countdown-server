name: Cloudflare

# Checks and plans infra/cloudflare (the DNS records) on pull requests that change it. The plan reads the live zone, so
# it needs the secrets below and is skipped without them (fork and Dependabot pull requests). Nothing is applied when a
# change merges, and releases don't touch DNS: the "Run workflow" button (Actions > Cloudflare) plans one environment
# on any ref, which shows drift, and with "apply" ticked, from main, also applies it after approval. See
# infra/cloudflare/README.md.
on:
  pull_request:
    branches: [main]
    paths:
      - infra/cloudflare/**
      - config/*.env
      - .github/workflows/cloudflare.yml
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the plan after approval
        type: boolean
        default: false
      target:
        description: The environment to plan and apply
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

# A new push to a PR replaces its running checks.
concurrency:
  group: cloudflare-${{ inputs.target || 'pr' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in step with required_version in infra/cloudflare/versions.tf.
  TF_VERSION: 1.16.6
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugins
  # The state bucket (Settings > Secrets and variables > Actions > Variables).
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
  TF_STATE_ENDPOINT: ${{ vars.TF_STATE_ENDPOINT }}
  # Oracle's S3 API refuses the AWS SDK's default chunked, checksummed upload, so these make the S3 backend send a
  # plain one.
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  APPLY: ${{ inputs.apply == true }}

defaults:
  run:
    working-directory: infra/cloudflare

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Validate
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init -backend=false -lockfile=readonly
          terraform validate

  plan:
    # A pull request plans both environments; a button run only the one it picked.
    name: plan (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'pull_request' && '["dev","prod"]' || format('["{0}"]', inputs.target || 'dev')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    outputs:
      # Whether the plan changes anything, so an apply with nothing to change asks for no approval.
      changes: ${{ steps.plan.outputs.changes }}
    # The plan only needs to read, so its credentials (CLOUDFLARE_API_TOKEN, a Zone:DNS:Read token, and the state
    # bucket's key) are the plan bot's; apply has the write token, after approval.
    env:
      TF_VAR_environment: ${{ matrix.target }}
      TF_STATE_KEY: ${{ matrix.target == 'prod' && 'cloudflare/prod/terraform.tfstate' || 'cloudflare/terraform.tfstate' }}
      HAVE_SECRETS: ${{ secrets.BW_CLIENTID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # DNS is applied from what has been reviewed and merged, not from a branch. Checked before planning, so a wrong
      # pick fails at once rather than after an approval.
      - name: Check apply is on main
        if: env.APPLY == 'true'
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Apply from main, not $GITHUB_REF"; exit 1; }

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # The credentials come from Vaultwarden (infra/cloudflare/secrets-map.json), through the dev bot, whose BW_* are
      # repository secrets: from countdown-server/dev it reads a Zone:DNS:Read token and the state bucket's key, so a
      # plan, which runs on any pull request, can't write DNS (the Edit token is only in countdown-server/prod, which
      # this bot can't read). Skipped, like the plan, where there are no secrets (a fork or Dependabot pull request).
      - name: Fetch the credentials from Vaultwarden
        if: env.HAVE_SECRETS == 'true'
        uses: nvorkinn/.github/actions/vaultwarden-secrets@6796027a4711b904d27024c6b28d3b1d42c3bb68 # main
        with:
          # An absolute path: this workflow's steps run in infra/cloudflare, which the map's path would otherwise be relative to.
          map: ${{ github.workspace }}/infra/cloudflare/secrets-map.json
          target: plan
          collection: countdown-server/dev
          export-env: "true"
          bw-clientid: ${{ secrets.BW_CLIENTID }}
          bw-clientsecret: ${{ secrets.BW_CLIENTSECRET }}
          bw-password: ${{ secrets.BW_PASSWORD }}

      - name: Skip the plan without secrets
        if: env.HAVE_SECRETS != 'true'
        run: |
          [ "$APPLY" != true ] || { echo "::error::No Vaultwarden credentials (BW_*), so nothing can be planned or applied"; exit 1; }
          echo "::notice::No Vaultwarden credentials (BW_*) here (a fork or Dependabot pull request, or not set up yet), so there is no plan."

      # Plans that won't be applied don't take the state lock. Exit code 2 from -detailed-exitcode means the plan has
      # changes, 0 none.
      - name: Plan
        id: plan
        if: env.HAVE_SECRETS == 'true'
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$TF_STATE_REGION" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="endpoints={s3=\"$TF_STATE_ENDPOINT\"}"
          status=0
          terraform plan -lock="$APPLY" -detailed-exitcode -out=tfplan || status=$?
          [ "$status" -ne 1 ] || exit 1
          echo "changes=$([ "$status" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # A table of the records that change, and the full plan folded below it as a coloured diff, for the run's
          # summary (which is what an approver sees) and the PR comment. Destroys and replacements also raise a warning.
          ./plan-summary.sh tfplan "$TF_VAR_environment" plan.md
          cat plan.md >> "$GITHUB_STEP_SUMMARY"
          [ "$status" -eq 2 ] || echo "::notice::No changes, so there is nothing to apply."

      # One comment per PR, updated on each push. Fork and Dependabot PRs get a read-only token, so they only have the
      # job summary.
      - name: Comment the plan on the PR
        if: >-
          env.HAVE_SECRETS == 'true'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET: ${{ matrix.target }}
        with:
          script: |
            const fs = require('fs');
            const target = process.env.TARGET;
            const marker = `<!-- cloudflare-plan-${target} -->`;
            // plan-summary.sh already keeps the full plan under GitHub's 65,536-character limit for a comment.
            const plan = fs.readFileSync('infra/cloudflare/plan.md', 'utf8');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n${plan}\n\nFor ${context.payload.pull_request.head.sha} ([run](${run}))`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number,
            });
            const mine = comments.find((c) => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Keep the plan for apply
        if: env.APPLY == 'true' && steps.plan.outputs.changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudflare-tfplan-${{ matrix.target }}
          path: infra/cloudflare/tfplan
          retention-days: 1

  # Applies exactly the plan above, after approval through the terraform environment's protection rule (terraform-prod for prod; DNS decides where
  # an environment's names point). If the state changed in between, Terraform rejects the plan as stale and nothing is
  # applied. A plan with no changes skips this, approval included.
  apply:
    needs: plan
    if: inputs.apply && needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Reviewers and the token that may write: dev's is `terraform`, production's `terraform-prod`.
    environment: ${{ inputs.target == 'prod' && 'terraform-prod' || 'terraform' }}
    concurrency:
      group: cloudflare-apply-${{ inputs.target }}
      cancel-in-progress: false
    # The environment's BW_* secrets take precedence over the repository's, so apply reads a token that may write while
    # plans read one that can only read.
    env:
      TF_VAR_environment: ${{ inputs.target }}
      TF_STATE_KEY: ${{ inputs.target == 'prod' && 'cloudflare/prod/terraform.tfstate' || 'cloudflare/terraform.tfstate' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # The write token, from countdown-server/prod, through the prod bot, whose BW_* are this environment's secrets: they
      # are only available once the environment's reviewers have approved, which is what gates a DNS change. (Dev's own
      # bot can't read that collection, so no unapproved job can get the token.) Both targets' DNS is the one zone.
      - name: Fetch the credentials from Vaultwarden
        uses: nvorkinn/.github/actions/vaultwarden-secrets@6796027a4711b904d27024c6b28d3b1d42c3bb68 # main
        with:
          # An absolute path: this workflow's steps run in infra/cloudflare, which the map's path would otherwise be relative to.
          map: ${{ github.workspace }}/infra/cloudflare/secrets-map.json
          target: apply
          collection: countdown-server/prod
          export-env: "true"
          bw-clientid: ${{ secrets.BW_CLIENTID }}
          bw-clientsecret: ${{ secrets.BW_CLIENTSECRET }}
          bw-password: ${{ secrets.BW_PASSWORD }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloudflare-tfplan-${{ inputs.target }}
          path: infra/cloudflare

      - name: Apply
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$TF_STATE_REGION" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="endpoints={s3=\"$TF_STATE_ENDPOINT\"}"
          terraform apply tfplan
