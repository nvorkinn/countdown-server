# Who can decrypt secrets/<environment>/*.env. Each environment's files are readable by Nikolai's laptop (to edit them)
# and by that environment's hosts only (/opt/auth-broker/age.key, at deploy time; dev has two while Oracle dev is still
# there: the second key is the old Oracle dev host's, the third is nikolai-server's), so the dev/QA host can never decrypt
# production's secrets. After changing a list, run `sops updatekeys secrets/<environment>/*.env`.
creation_rules:
  - path_regex: ^secrets/dev/[^/]+\.env$
    age: >-
      age10ekvquu5g773glj5a24ht3uaegdm6atkv7el8nmql4jyvtr3fgeqyxvfuy,
      age1dwge8qknrx7sxee9yg6u5yn2fgpzd2hqrv3gna7x0d937s4a6qysvud3x0,
      age1ggns6rwa8mdku6rzetu8rv6zxg56mqjpt8drjtkf43a4jhx9fftqwxczqu
  # Production: the laptop's key (the first of dev's two) and the production host's, so the dev/QA host can't decrypt
  # these.
  - path_regex: ^secrets/prod/[^/]+\.env$
    age: >-
      age10ekvquu5g773glj5a24ht3uaegdm6atkv7el8nmql4jyvtr3fgeqyxvfuy,
      age1ksnax9522wkxkqqxuh3slc4368u6unmd4ed420umve5m2tfmxgmsmv5wy9
